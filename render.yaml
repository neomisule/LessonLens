databases:
  - name: lecturelens-postgres
    databaseName: lecturelens
    user: lecturelens
    plan: starter
    postgresMajorVersion: 16

services:
  # ── Redis ────────────────────────────────────────────────────────────────────
  - type: redis
    name: lecturelens-redis
    plan: starter
    ipAllowList: []  # private networking only

  # ── Backend API ───────────────────────────────────────────────────────────────
  - type: web
    name: lecturelens-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lecturelens-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lecturelens-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false  # set to your Vercel frontend URL

  # ── Celery worker ─────────────────────────────────────────────────────────────
  - type: worker
    name: lecturelens-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    autoDeploy: true
    startCommand: celery -A app.jobs.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lecturelens-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lecturelens-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
