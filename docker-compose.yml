
# ─────────────────────────────────────────────────────────────────────────────
#  LectureLens – local development stack
#  Usage: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lecturelens}:${POSTGRES_PASSWORD:-lecturelens_dev}@postgres:5432/${POSTGRES_DB:-lecturelens}
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: development
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-prod}
  ALLOWED_ORIGINS: http://localhost:3000

services:
  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lecturelens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lecturelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lecturelens_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lecturelens}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lecturelens}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache / message broker ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lecturelens_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps     # use deps stage in dev (has build tools for hot-reload)
    container_name: lecturelens_backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Dev: hot-reload with single worker
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    container_name: lecturelens_worker
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.jobs.worker.celery_app worker --loglevel=info --concurrency=2

  # ── Next.js frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps     # dev: mount source, don't pre-build
    container_name: lecturelens_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
